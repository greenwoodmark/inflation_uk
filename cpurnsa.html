<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US CPURNSA Inflation Curve</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { margin: 0; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 18px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; }
    .subtitle, .meta { color: #475569; }
    #chart { width: 100%; min-height: 600px; }
    #warning { display: none; margin: 14px 0; padding: 10px 12px; border-radius: 7px; background: #fef3c7; color: #92400e; }
    #error { color: #b91c1c; }
    a { color: #075985; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div id="warning"></div>
      <div id="chart"></div>
      <p id="meta" class="meta"></p>
      <p><a href="pca.html">View six-driver PCA diagnostics →</a></p>
      <p id="error"></p>
    </div>
  </main>
  <script>
    async function loadCurve() {
      const response = await fetch('data/cpurnsa_curve_history.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Curve data request failed: ${response.status}`);
      return response.json();
    }
    function curveKindLabel(snapshot) {
      return snapshot.curve_kind === 'shadow_posterior'
        ? 'shadow/posterior estimate'
        : snapshot.curve_kind === 'canonical_deterministic'
          ? 'canonical deterministic fit'
          : snapshot.curve_kind || 'historical curve';
    }
    function render(payload) {
      const snapshots = payload.snapshots || [];
      if (!snapshots.length) throw new Error('No curve snapshots are available');
      const traces = snapshots.map(snapshot => ({
        x: snapshot.reference_month,
        y: snapshot.yoy_rate_percent,
        mode: 'lines+markers',
        name: `${snapshot.label} — ${snapshot.model_date} (${curveKindLabel(snapshot)})`,
        customdata: snapshot.node_status,
        hovertemplate: '%{x}<br>Rate: %{y:.3f}%<br>Status: %{customdata}<extra>' + snapshot.label + '</extra>'
      }));
      const latest = snapshots[0];
      const dailyMoveSd = latest.daily_move_sd_bp || [];
      const hasUncertaintyBand = dailyMoveSd.length === latest.yoy_rate_percent.length
        && dailyMoveSd.every(value => Number.isFinite(value));
      if (hasUncertaintyBand) {
        const lower = latest.yoy_rate_percent.map((rate, index) => rate - dailyMoveSd[index] / 100.0);
        const upper = latest.yoy_rate_percent.map((rate, index) => rate + dailyMoveSd[index] / 100.0);
        traces.push({
          x: latest.reference_month.concat([...latest.reference_month].reverse()),
          y: upper.concat([...lower].reverse()),
          fill: 'toself', fillcolor: 'rgba(14, 116, 144, 0.14)',
          line: { color: 'rgba(14, 116, 144, 0)' },
          name: 'Latest ± 1σ daily move', hoverinfo: 'skip'
        });
      }
      Plotly.newPlot('chart', traces, {
        title: {
          text: 'US CPURNSA Inflation Curve<br><sup>One-year zero-coupon inflation rates by reference CPI month</sup>',
          x: 0.5,
          xanchor: 'center'
        },
        xaxis: { title: 'Reference CPI month', type: 'date' },
        yaxis: { title: 'Y/Y inflation rate (%)', ticksuffix: '%' },
        hovermode: 'x unified', legend: { orientation: 'h', y: -0.2 },
        margin: { t: 72, r: 25, b: 105, l: 70 }, paper_bgcolor: 'white', plot_bgcolor: 'white'
      }, { responsive: true, displaylogo: false });
      if (payload.warning) { const warning = document.getElementById('warning'); warning.textContent = payload.warning; warning.style.display = 'block'; }
      const uncertainty = latest.uncertainty_status === 'available'
        ? `Uncertainty: ±1σ historical ${latest.uncertainty_alignment === 'node_position' ? 'curve-node' : 'same-reference-month'} moves over ${latest.uncertainty_window} observations`
        : 'Uncertainty: unavailable until sufficient model history exists';
      document.getElementById('meta').textContent = `Curve: ${curveKindLabel(latest)} | Latest status: ${latest.status} | Model: ${latest.model_version} | Training cutoff: ${latest.training_cutoff} | Source trades: ${latest.source_trade_count} | ${uncertainty} | Published: ${payload.generated_at_utc}`;
    }
    loadCurve().then(render).catch(error => { document.getElementById('error').textContent = error.message; });
  </script>
</body>
</html>
